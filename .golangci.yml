version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    gocyclo:
      min-complexity: 6
    gocognit:
      min-complexity: 10
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters:
          - revive
        text: "^(exported|package-comments):"
      # A credencial do Compose aparece literal na fixture de teste e no pacote de
      # apoio da suíte de jornada, que é onde o DSN default dela mora agora para
      # os sete pacotes não repetirem o literal. Ela é local, já está versionada
      # no compose.yaml e não é segredo.
      - linters:
          - gosec
        text: "^G101:"
        path: (_test\.go|internal/suiteenv/)

formatters:
  enable:
    - gofmt
    - goimports
