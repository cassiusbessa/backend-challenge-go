name: junglegaming

networks:
  junglegaming:
    name: junglegaming

volumes:
  postgres: {}
  tools: {}
  # Trace, log e métrica sobrevivem ao reinício do serviço que os guarda. O teto
  # de retenção de cada um nasce junto, no arquivo de configuração versionado do
  # backend — o do Prometheus no `command:` dele, porque é flag e não arquivo.
  # `docker compose down -v` continua sendo o caminho de volta ao estado limpo.
  tempo: {}
  loki: {}
  prometheus: {}
  terraform: {}

services:
  postgres:
    image: postgres:16.15
    # O padrão de 100 não comporta ao mesmo tempo o pool de cada réplica — o
    # `pgxpool` abre até o número de CPUs —, as instâncias de um cenário e a
    # suíte de jornada.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-junglegaming}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-junglegaming}
      POSTGRES_DB: ${POSTGRES_DB:-junglegaming}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - junglegaming
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs,sns,iam
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    networks:
      - junglegaming
    healthcheck:
      test: ["CMD-SHELL", "h=$$(curl -fsS http://localhost:4566/_localstack/health); printf '%s' \"$$h\" | grep -Eq '\"sqs\": \"(available|running)\"' && printf '%s' \"$$h\" | grep -Eq '\"sns\": \"(available|running)\"' && printf '%s' \"$$h\" | grep -Eq '\"iam\": \"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: localhost
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/junglegaming-realm.json:/opt/keycloak/data/import/junglegaming-realm.json:ro
    networks:
      - junglegaming
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
      - tools:/tools:ro
    networks:
      - junglegaming
    depends_on:
      tools:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      # `/loki` é o diretório de dados da própria imagem, e o dono dele é o
      # usuário que o processo usa: um volume nomeado montado aqui nasce
      # gravável, o que não vale para um caminho que a imagem não traz.
      - loki:/loki
      - tools:/tools:ro
    networks:
      - junglegaming
    depends_on:
      tools:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - tools:/tools:ro
    networks:
      - junglegaming
    depends_on:
      tools:
        condition: service_completed_successfully
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tools:
    image: busybox:1.37.0-musl
    command: ["cp", "/bin/busybox", "/tools/busybox"]
    volumes:
      - tools:/tools
    networks:
      - junglegaming

  # O schema é aplicado uma vez, antes de qualquer réplica. O binário da
  # aplicação não carrega código de migration.
  #
  # A suíte de integração aponta para um banco próprio, porque a aplicação de pé
  # tem os próprios workers: o relay de outbox dela varre a tabela inteira a cada
  # segundo, sem filtrar carteira, e publica a linha que um caso espera ver morta.
  #
  # MIGRATE_DB escolhe o banco, e o padrão é o da aplicação. Ela é interpolada na
  # leitura deste arquivo, com o ambiente do shell, e não dentro do container:
  # `docker compose run --rm -e MIGRATE_DB=x migrate` define a variável depois de
  # o comando já estar montado, aplica no banco errado e imprime `no change` com
  # código zero — indistinguível de uma migration já aplicada. Por isso o caminho
  # publicado no README nomeia o destino nos argumentos do próprio migrate, onde
  # um destino que não existe falha:
  #
  #   docker compose run --rm migrate -path=/migrations -database "<url>" up
  migrate:
    image: migrate/migrate:v4.19.0
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-junglegaming}:${POSTGRES_PASSWORD:-junglegaming}@postgres:5432/${MIGRATE_DB:-${POSTGRES_DB:-junglegaming}}?sslmode=disable"
      - "up"
    volumes:
      - ./deploy/migrations:/migrations:ro
    networks:
      - junglegaming
    depends_on:
      postgres:
        condition: service_healthy

  # O apply do broker, uma vez por subida e antes de qualquer réplica. O LocalStack
  # não persiste, então cada subida o provisiona de novo; sobre um broker já
  # provisionado o apply termina sem mudança. Um processo de pé diante de um broker
  # sem tópico grava eventos que o relay mata na décima recusa, e por isso um apply
  # que falha deixa o `wager` parado. O CI e o `make provision` rodam este mesmo
  # serviço, então a versão do Terraform fica escrita só aqui.
  #
  # O estado e a chave ficam no diretório montado, onde o README os aponta. O
  # contêiner roda como root, e o último passo devolve ao dono do diretório os
  # arquivos que o apply escreveu, para ele ler a chave e apagá-los sem `sudo`. O
  # cache do provider, perto de 700 MB, fica no volume, fora da árvore.
  provision:
    image: hashicorp/terraform:1.13.3
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        terraform init -input=false
        terraform apply -auto-approve -input=false -lock-timeout=60s
        owner=$$(stat -c %u:%g .)
        for file in terraform.tfstate terraform.tfstate.backup wager-sender.keys .terraform.lock.hcl; do
          if [ -e "$$file" ]; then chown "$$owner" "$$file"; fi
        done
    environment:
      TF_DATA_DIR: /terraform-data
      TF_IN_AUTOMATION: "1"
      TF_VAR_localstack_endpoint: http://localstack:4566
    volumes:
      - ./deploy/terraform/localstack:/workspace
      - terraform:/terraform-data
    networks:
      - junglegaming
    depends_on:
      # `restart: true` faz o Compose rodar o apply de novo quando ele mesmo
      # reinicia o broker, como em `docker compose restart localstack`.
      localstack:
        condition: service_healthy
        restart: true

  prometheus:
    image: prom/prometheus:v3.13.3-busybox
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
      # O teto de retenção da métrica. Três dias, o mesmo horizonte declarado nos
      # arquivos do Tempo e do Loki.
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=72h"
    ports:
      - "9095:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    networks:
      - junglegaming
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  grafana:
    image: grafana/grafana:12.2.10
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/grafana/provisioning/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tools:/tools:ro
    networks:
      - junglegaming
    depends_on:
      tools:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  wager:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8090"
      DATABASE_URL: postgres://${POSTGRES_USER:-junglegaming}:${POSTGRES_PASSWORD:-junglegaming}@postgres:5432/${POSTGRES_DB:-junglegaming}?sslmode=disable
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SNS_ENDPOINT: http://localstack:4566
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:wallet-events.fifo
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      # O issuer é o que o token anuncia em `iss`, visto do host. O JWKS é
      # buscado de dentro da rede, onde `localhost` seria o próprio processo.
      IDP_ISSUER: http://localhost:8080/realms/junglegaming
      IDP_JWKS_URL: http://keycloak:8080/realms/junglegaming/protocol/openid-connect/certs
      CLIENTS_PATH: /etc/wager/clients.yaml
      QUEUE_SENDERS_PATH: /etc/wager/queue-senders.yaml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    # Várias réplicas não dividem uma porta do host: quem publica `8090` é o
    # `balancer`, e cada réplica escuta só na rede do Compose.
    deploy:
      replicas: ${WAGER_REPLICAS:-3}
    volumes:
      - ./deploy/local/clients.yaml:/etc/wager/clients.yaml:ro
      - ./deploy/local/queue-senders.yaml:/etc/wager/queue-senders.yaml:ro
    networks:
      - junglegaming
    stop_grace_period: 30s
    # A saúde do processo é a própria rota de liveness dele, e não o fato de o
    # container estar de pé: a porta abre depois do mapa de clientes e do pool.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      # Sem o IdP, o processo sobe e recusa todo token: o JWKS não responde, e a
      # borda não tem como distinguir credencial inválida de emissor ausente.
      keycloak:
        condition: service_healthy

  # O endereço único das réplicas. O HAProxy as descobre pelo DNS do Docker e só
  # encaminha para a que responde ready; sem nenhuma pronta, responde 503.
  balancer:
    image: haproxy:3.4.5-alpine
    ports:
      - "8090:8090"
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - junglegaming
    # A liveness de uma réplica, pedida através do balanceador: ele está saudável
    # quando encaminha.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      wager:
        condition: service_healthy
