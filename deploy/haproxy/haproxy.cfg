# O endereço único das réplicas do `wager` no Compose. As réplicas não publicam
# porta no host: o balanceador as descobre pelo DNS do Docker e manda tráfego só
# para a que responde ready, como o Service do Kubernetes faria.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    # O check espera a resposta da própria rota, que tem prazo de 1 s no servidor:
    # um banco pausado responde 503 em vez de estourar o check junto com ele.
    timeout check 2s
    # A conexão recusada é tentada de novo e, na última tentativa, em outra
    # réplica. O `retry-on` fica no padrão, a falha de conexão: um pedido que já
    # chegou a uma réplica não é reenviado a outra, porque um `POST /wallets`
    # repetido responderia 409 a quem não pediu duas carteiras.
    retries 3
    option redispatch

# O DNS embutido do Docker responde pelo nome do serviço com o IP de cada réplica
# de pé, e deixa de responder pela que parou.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s
    hold obsolete 5s
    accepted_payload_size 8192

frontend api
    bind :8090
    # A sonda do Compose bate de cinco em cinco segundos e afogaria o log, como
    # afogaria o do processo, que também deixa as rotas de saúde de fora.
    http-request set-log-level silent if { path_beg /health/ }
    default_backend wager

backend wager
    balance roundrobin
    option httpchk GET /health/ready
    # Dez é o teto de réplicas que o balanceador enxerga; acima dele, as
    # excedentes não recebem tráfego. `init-addr none` deixa o balanceador subir
    # antes de o nome resolver.
    server-template wager 1-10 wager:8090 check inter 1s fall 2 rise 1 resolvers docker init-addr none
