# Teste de unidade das regras, no formato do promtool. Roda sem a stack de pé:
#
#   docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool \
#     prom/prometheus:v3.13.3-busybox test rules /rules/rules/settlement_test.yml
#
# O caminho do arquivo de regras é relativo a este arquivo.
rule_files:
  - settlement.yml

evaluation_interval: 15s

tests:
  # A divergência dispara na hora: a série subiu na janela, e não há `for`.
  - interval: 15s
    input_series:
      - series: 'wager_reconciliation_divergences_total{origin="watch",divergence="BALANCE_MISMATCH"}'
        values: '0 0 0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 45s
        alertname: ReconciliationDivergenceFound
        exp_alerts: []
      - eval_time: 1m15s
        alertname: ReconciliationDivergenceFound
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A reconciliation found the stored balance and the ledger in disagreement
              description: The divergence series rose in the last 15 minutes. The log line names the wallet and the tokens.

  # Uma série estável, ainda que acima de zero, não dispara: o que importa é a
  # subida, não o valor acumulado.
  - interval: 15s
    input_series:
      - series: 'wager_reconciliation_divergences_total{origin="http",divergence="CHAIN_BREAK"}'
        values: '3 3 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: ReconciliationDivergenceFound
        exp_alerts: []

  # A outbox acima de 30s por um minuto inteiro dispara.
  - interval: 15s
    input_series:
      - series: 'wager_outbox_oldest_pending_age_seconds'
        values: '31 46 61 76 91 106 121 136'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: OutboxOldestPendingTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The oldest pending outbox row is older than 30 seconds
              description: A committed event has not reached the topic for more than a minute. The relay log names the row and the refusal.

  # Acima de 30s por menos de um minuto não dispara: é o lease legítimo de um
  # envio lento.
  - interval: 15s
    input_series:
      - series: 'wager_outbox_oldest_pending_age_seconds'
        values: '0 0 31 46 0 0 0 0'
    alert_rule_test:
      - eval_time: 45s
        alertname: OutboxOldestPendingTooOld
        exp_alerts: []
      - eval_time: 1m45s
        alertname: OutboxOldestPendingTooOld
        exp_alerts: []

  # A 29s, abaixo do limiar, nunca dispara por mais que dure.
  - interval: 15s
    input_series:
      - series: 'wager_outbox_oldest_pending_age_seconds'
        values: '29 29 29 29 29 29 29 29'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: OutboxOldestPendingTooOld
        exp_alerts: []

  # O veredito que o observador não produziu dispara na hora, sem `for`.
  - interval: 15s
    input_series:
      - series: 'wager_reconciliation_failures_total{origin="watch"}'
        values: '0 0 0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 45s
        alertname: ReconciliationVerdictFailed
        exp_alerts: []
      - eval_time: 1m15s
        alertname: ReconciliationVerdictFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The divergence watcher could not produce the verdict of a wallet
              description: The watcher's reconciliation failures rose in the last 15 minutes. The log line names the wallet and carries the stack.

  # A falha só da rota não dispara: quem chamou já recebeu a resposta.
  - interval: 15s
    input_series:
      - series: 'wager_reconciliation_failures_total{origin="http"}'
        values: '0 0 0 0 1 2 3 4'
      - series: 'wager_reconciliation_failures_total{origin="watch"}'
        values: '0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: ReconciliationVerdictFailed
        exp_alerts: []

  # Uma série estável, ainda que acima de zero, não dispara.
  - interval: 15s
    input_series:
      - series: 'wager_reconciliation_failures_total{origin="watch"}'
        values: '2 2 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: ReconciliationVerdictFailed
        exp_alerts: []
