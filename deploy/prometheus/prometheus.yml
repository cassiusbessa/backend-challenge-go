# O teto de retenção não cabe aqui: o Prometheus o recebe como flag, e ele está
# declarado no `command:` do serviço no `compose.yaml`, ao lado do volume nomeado
# que faz a métrica sobreviver ao reinício.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

# As regras de alerta, montadas pelo `compose.yaml` a partir de
# `deploy/prometheus/rules/`. O arquivo é nomeado, e não um glob: o teste das
# regras mora no mesmo diretório e não é uma regra.
rule_files:
  - /etc/prometheus/rules/settlement.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Cada réplica é um alvo: o DNS do Docker responde pelo nome do serviço com o IP
  # de cada uma, e o rótulo `instance` as distingue. Um alvo fixo em `wager:8090`
  # raspava uma réplica qualquer a cada vez, como se fossem uma só.
  - job_name: wager
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["wager"]
        type: A
        port: 8090
        refresh_interval: 5s
