# O teto de retenção não cabe aqui: o Prometheus o recebe como flag, e ele está
# declarado no `command:` do serviço no `compose.yaml`, ao lado do volume nomeado
# que faz a métrica sobreviver ao reinício.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: wager
    metrics_path: /metrics
    static_configs:
      - targets: ["wager:8090"]
