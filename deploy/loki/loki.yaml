auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# O teto de retenção, e o compactor que o aplica. O volume nomeado do Compose faz
# o log sobreviver ao reinício; sem teto isso só troca "perco tudo a cada
# reinício" por "o volume cresce até o disco acabar". Três dias cobrem olhar na
# segunda para uma execução da sexta, que é o horizonte de um ambiente local.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  retention_period: 72h
