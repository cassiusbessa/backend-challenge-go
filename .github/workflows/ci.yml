name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: unit test constraints
        run: go run -C scripts/testgates . -root "$PWD"

      - name: lint
        if: hashFiles('go.mod') != ''
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

      - name: unit tests
        if: hashFiles('go.mod') != ''
        run: go test -race -count=1 -coverprofile=cover.out ./...

      - name: coverage floors
        if: hashFiles('go.mod') != ''
        run: go run -C scripts/testgates . -root "$PWD" -cover "$PWD/cover.out"

      - name: Start postgres, localstack, and otel-collector
        if: hashFiles('go.mod') != ''
        run: docker compose up -d --wait --timeout 180 postgres localstack otel-collector

      - uses: hashicorp/setup-terraform@v3
        if: hashFiles('go.mod') != ''
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: provision the local broker
        if: hashFiles('go.mod') != ''
        run: |
          terraform -chdir=deploy/terraform/localstack init -input=false
          terraform -chdir=deploy/terraform/localstack apply -auto-approve -input=false

      - name: integration tests
        if: hashFiles('go.mod') != ''
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: go test -race -count=1 -tags=integration ./...
