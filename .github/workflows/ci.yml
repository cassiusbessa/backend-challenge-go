name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dashboard is a hand-written file the Grafana provisions on the way
      # up, and a file that is not JSON is a dashboard that silently never
      # appears. It is the first thing checked, before any Go.
      - name: dashboard is valid json
        run: jq -e . deploy/grafana/dashboards/liquidacao.json > /dev/null

      # The rules are tested with the promtool of the very image the Compose
      # runs, so the version that tests is the version that evaluates. It comes
      # before any Go: a rule that stopped firing is red on its own.
      - name: alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool \
            prom/prometheus:v3.13.3-busybox test rules /rules/rules/settlement_test.yml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: unit test constraints
        run: go run -C scripts/testgates . -root "$PWD"

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      # `scripts/` carries a module per tool, and the action above runs at the
      # root, whose `./...` stops at the module boundary. Each one is named here
      # or it is linted nowhere.
      - name: lint the nested modules
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: scripts/envcheck

      - name: lint the nested modules of the gates
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: scripts/testgates

      - name: unit tests
        run: go test -race -count=1 -coverprofile=cover.out ./...

      # Same boundary as the lint above: the `./...` of the root module reaches
      # no nested module, so the tests of the verifier ran nowhere until this
      # step existed. `-C` has to be the first flag of the command.
      - name: unit tests of the nested modules
        run: |
          go test -C scripts/envcheck -race -count=1 ./...
          go test -C scripts/testgates -race -count=1 ./...

      - name: coverage floors
        run: go run -C scripts/testgates . -root "$PWD" -cover "$PWD/cover.out"

      - name: Start postgres, localstack, keycloak, and otel-collector
        run: docker compose up -d --wait --timeout 300 postgres localstack keycloak otel-collector

      - name: apply the financial schema
        run: docker compose run --rm migrate

      # The journey suite owns a database of its own in the same cluster, and the
      # local path in the README creates it the same way. CREATE DATABASE takes no
      # IF NOT EXISTS, so the existence is asked first.
      - name: create and migrate the journey suite database
        run: |
          docker compose exec -T postgres psql -U junglegaming -d junglegaming -tAc \
            "SELECT 1 FROM pg_database WHERE datname='junglegaming_test'" | grep -q 1 \
            || docker compose exec -T postgres createdb -U junglegaming junglegaming_test
          docker compose run --rm migrate -path=/migrations \
            -database "postgres://junglegaming:junglegaming@postgres:5432/junglegaming_test?sslmode=disable" up

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: provision the local broker
        run: |
          terraform -chdir=deploy/terraform/localstack init -input=false
          terraform -chdir=deploy/terraform/localstack apply -auto-approve -input=false

      # -p 1 is not a performance knob: the wallet suite shortens the access token
      # lifespan of the shared Keycloak realm to prove the border refuses an
      # expired token, and any suite that asks for a token inside that window
      # gets a 401. Postgres, LocalStack and Keycloak are shared, so the packages
      # run one at a time. Removing the flag brings the flake back.
      - name: integration tests
        env:
          DATABASE_URL: postgres://junglegaming:junglegaming@localhost:5432/junglegaming_test?sslmode=disable
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: go test -race -count=1 -p 1 -tags=integration ./...
